name: Deploy Site

on:
  push:
    branches: [ "master" ]
    paths:
      - 'site/**'
      - 'src/Figgle/**'
      - 'src/Figgle.Fonts/**'
      - 'fonts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Publish site
      run: dotnet publish site/Figgle.Site/Figgle.Site.csproj --configuration Release --output publish

    - name: Rewrite base href for GitHub Pages
      run: sed -i 's|<base href="/" />|<base href="/figgle/" />|g' publish/wwwroot/index.html

    - name: Add .nojekyll
      run: touch publish/wwwroot/.nojekyll

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
