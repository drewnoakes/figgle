<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script>
        // SPA fallback for GitHub Pages — redirect 404s to index.html
        var path = window.location.pathname;
        window.location.replace(window.location.origin + '/figgle/' + '?redirect=' + encodeURIComponent(path));
    </script>
</head>
<body></body>
</html>
